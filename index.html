<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>3학년 2반 알림판</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>3학년 2반 알림판</title>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#17231d;--mut:#5f6d65;--line:#dbe3dc;--acc:#1f6b4c;--soft:#e2efe7;--warn:#8a3b2e}
@media(prefers-color-scheme:dark){:root{--bg:#111714;--card:#19211d;--ink:#e6ece8;--mut:#9aa7a0;--line:#2b3631;--acc:#62c194;--soft:#1e3529;--warn:#e59a8a}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px}
h1{font:700 1.5rem/1.2 "Gowun Dodum","IBM Plex Sans KR",sans-serif;margin:4px 0 14px}
.top{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.top h1{margin:0;flex:1}
.tb{flex:none;min-height:44px;padding:6px 12px;border-radius:10px;border:1px solid var(--acc);background:var(--card);color:var(--acc);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.tabs{display:flex;align-items:stretch;gap:6px;margin:0 0 12px;padding:2px 0 6px;overflow:hidden}
.tabs .tw{flex:1 1 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;min-width:0}
.tabs button{flex:0 0 auto;min-width:0;padding:6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;line-height:1.25}
.tabs button small{display:block;font-weight:400;font-size:.78rem;color:var(--mut)}
.tabs button[aria-selected=true]{border-color:var(--acc);background:var(--soft)}
.tabs .nv{flex:0 0 34px;min-width:34px;padding:0;border-radius:10px;font-size:1.3rem;font-weight:800;color:var(--acc)}
.tabs .nv:disabled{opacity:.25;cursor:default}
.nav button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.2rem;cursor:pointer}
.nav button:disabled{opacity:.35}
.nav .d{flex:1;text-align:center;font-weight:700;font-size:1.1rem}
.nav .d small{display:block;font-weight:400;font-size:.8rem;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:1rem}
.notice{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.att .big{font-size:2.4rem;font-weight:700;color:var(--acc);line-height:1}
.att .big small{font-size:1rem;color:var(--mut);font-weight:400}
.att button.big{display:inline-flex;align-items:baseline;gap:4px;background:none;border:2px solid transparent;border-radius:12px;padding:4px 10px;margin:-4px -10px;font:inherit;font-size:2.4rem;font-weight:700;color:var(--acc);cursor:pointer;line-height:1}
.att button.big.on{border-color:var(--acc);background:var(--soft)}
.att button.big small::after{content:" ▾";font-size:.8rem}
.seat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px 8px;margin-top:8px}
.seat span{border:1.5px solid var(--acc);background:var(--card);border-radius:8px;padding:5px 4px;text-align:center;font-size:.85rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere;word-break:keep-all}
.seat span i{display:block;font-style:normal;font-weight:400;font-size:.7rem;color:var(--mut)}
.seat span em{display:block;font-style:normal;font-weight:600;font-size:.68rem;color:var(--acc)}
.seat span.out{border:1.5px dashed var(--line);background:var(--bg);color:var(--mut);font-weight:400}
.seat span.out em{color:var(--warn)}
.seat span.emp{visibility:hidden}
.desk{width:fit-content;margin:8px auto 0;padding:4px 24px;border:1.5px solid var(--acc);border-radius:8px;background:var(--soft);color:var(--acc);font-weight:700;font-size:.8rem;letter-spacing:.2em}
.sleg{font-size:.75rem;color:var(--mut);margin-top:6px}
.desk.top{margin:8px auto 0}
.svt{display:flex;gap:0;margin:8px 0 0;border:1.5px solid var(--acc);border-radius:999px;overflow:hidden;width:fit-content}
.svt button{min-height:32px;padding:3px 12px;border:0;background:var(--card);color:var(--acc);font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.svt button[aria-pressed=true]{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
@media(max-width:380px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.det ul{margin:6px 0 0;padding:0;list-style:none}.det li{padding:4px 0;border-top:1px dashed var(--line)}.det li:first-child{border-top:0}.det .no{color:var(--mut);font-variant-numeric:tabular-nums;margin-right:6px}.det .m{color:var(--mut);margin-left:6px}
.grid button{background:var(--soft);border:2px solid transparent;border-radius:10px;padding:8px;text-align:center;font:inherit;font-size:.82rem;color:var(--mut);cursor:pointer;min-height:64px}
.grid button.on{border-color:var(--acc)}
.grid button:disabled{cursor:default;opacity:.6}
.det{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:.95rem}
.det b{color:var(--acc)}
.hint{font-size:.75rem;color:var(--mut);margin-top:8px}
.grid b{display:block;font-size:1.25rem;color:var(--ink)}
.at{font-size:.75rem;color:var(--mut);margin-top:10px}
.empty{color:var(--mut)}
.docs ul{margin:0;padding:0;list-style:none}.docs li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:9px 0;border-top:1px dashed var(--line)}.docs li:first-child{border-top:0}
.docs .no{color:var(--mut);font-variant-numeric:tabular-nums}.docs .nm{font-weight:700}.docs .wd{color:var(--mut);font-size:.88rem}
.docs .dc{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--warn);background:var(--soft);border-radius:999px;padding:1px 10px}
.docs .cnt{font-size:.85rem;font-weight:700;color:var(--warn);margin-left:6px}.docs .cnt.plan{color:var(--acc)}.docs .cnt.ok{color:var(--mut)}
.docs li.plan .dc{color:var(--acc)}.docs li.ok .dc{color:var(--mut);background:transparent;border:1px solid var(--line)}.docs li.ok .nm,.docs li.ok .wd{color:var(--mut)}
.jo .jw+.jw{margin-top:10px}
.jo .jh{font-weight:700;font-size:.9rem;color:var(--acc);margin-bottom:4px}
.jo ul{margin:0;padding:0;list-style:none}
.jo li{padding:8px 12px;margin-top:6px;border-radius:10px;background:var(--soft);border-left:4px solid var(--acc);overflow-wrap:anywhere;word-break:keep-all;line-height:1.45}
.foot{font-size:.78rem;color:var(--mut);text-align:center;margin-top:16px}
:root{--tk-ink:var(--ink);--tk-mut:var(--mut);--tk-acc:var(--acc);--tk-soft:var(--soft);--tk-line:var(--line);--tk-line2:#b9c6bd;--tk-red:#d23b3b;--tk-blue:#1f6fd1;--tk-green:#1f8a4c;--tk-orange:#d9750c}
@media(prefers-color-scheme:dark){:root{--tk-line2:#4a5a52;--tk-red:#ff7b7b;--tk-blue:#7cb4ff;--tk-green:#5fd08f;--tk-orange:#ffad5c}}
.notice-card{border:2px solid var(--acc);padding:18px 18px 14px;box-shadow:0 6px 20px rgba(31,107,76,.10)}
/* 🌸 분홍 날 (D와 같은 기준: 결석 15명 이상 또는 전원 결석) */
:root{--pink:#c2417a;--pink-soft:#fbe0ec}
@media(prefers-color-scheme:dark){:root{--pink:#f08cb8;--pink-soft:#40222f}}
.tabs button.pink{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.tabs button.pink small{color:var(--pink)}
.tabs button.pink[aria-selected=true]{border-color:var(--pink);background:var(--pink);color:#fff}
.tabs button.pink[aria-selected=true] small{color:#fff}
.notice-card.pinkday{border-color:var(--pink);background:var(--pink-soft);box-shadow:0 6px 20px rgba(194,65,122,.14)}
.notice-card.pinkday .nh h2{color:var(--pink)}
.pinkln{margin:0 0 10px;font-size:.88rem;font-weight:700;color:var(--pink)}
/* 고른 날짜는 늘 가운데, 양옆(전날·다음 날)은 흐리게 (J와 같음, 11/25) */
.tabs .tw button[aria-selected=false]{opacity:.45;transform:scale(.94)}
.tabs .tw button[aria-selected=false]:hover{opacity:.75}
.tabs .tw .ph{visibility:hidden}
.tabs .tw .dd{font-style:normal;margin-left:2px;opacity:.7}
/* 📅 고른 날짜 탭 누르면 뜨는 달력 (J와 같음) */
.calov{position:fixed;inset:0;overflow:auto;z-index:70;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:84px 16px 16px}
.calbx{width:100%;max-width:360px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.calhd{display:flex;align-items:center;gap:6px;margin-bottom:8px}.calhd b{flex:1;text-align:center;font-size:1.05rem}
.calhd button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--acc);font:inherit;font-size:1.2rem;font-weight:800;cursor:pointer}
.calhd button:disabled{opacity:.25;cursor:default}.calhd .calx{color:var(--mut);font-size:1rem}
.calgr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgr .wd{text-align:center;font-size:.75rem;color:var(--mut);padding:2px 0}.calgr .wd.su{color:var(--warn)}
.calgr button{position:relative;aspect-ratio:1/1;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;padding:0}
.calgr button:disabled{border-color:transparent;background:none;color:var(--mut);opacity:.4;font-weight:400;cursor:default}
.calgr button.pink{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.calgr button.td{box-shadow:inset 0 0 0 2px var(--acc)}
.calgr button.sel{background:var(--acc);border-color:var(--acc);color:#fff}.calgr button.pink.sel{background:var(--pink);border-color:var(--pink)}
.calgr button i{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}.calgr button.sel i{background:#fff}.calgr button.pink i{background:var(--pink)}
.calft{margin-top:10px;font-size:.75rem;color:var(--mut);line-height:1.5}
.notice-card .nh{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.notice-card .nh h2{margin:0;font-size:1.2rem}
.notice-card .prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:2px 0 12px}
.notice-card .prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.tk{font-size:16px;line-height:1.6;color:var(--tk-ink)}
.tk-title{font-weight:800;font-size:1.15em;line-height:1.35;margin:0 0 4px}
.tk-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.95em;color:var(--tk-acc);margin:4px 0 6px}
.tk-left{margin-left:auto;font-size:.78em;font-weight:700;color:var(--tk-acc);background:var(--tk-soft);border-radius:999px;padding:1px 9px}
.tk-left:empty{display:none}
.tk-item{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-top:1px solid var(--tk-line)}
.tk-item:first-of-type{border-top:0}
.tk-ck{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--tk-line2);background:transparent;padding:0;position:relative;cursor:pointer}
span.tk-ck{cursor:default}
.tk-item.done .tk-ck{background:var(--tk-acc);border-color:var(--tk-acc)}
.tk-item.done .tk-ck::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.tk-tx{flex:1;display:flex;gap:8px;min-width:0}
.tk-n{flex:none;font-weight:800;color:var(--tk-acc);min-width:1.1em}
.tk-bd{min-width:0;overflow-wrap:anywhere;word-break:keep-all}
.tk-item.done .tk-tx{color:var(--tk-mut)}
.tk-item.done .tk-bd{text-decoration:line-through;text-decoration-thickness:2px}
.tk-item.done .tk-n{color:var(--tk-mut)}
.tk-p{margin:6px 0;overflow-wrap:anywhere;word-break:keep-all}
.tk-note{margin:6px 0 0;padding:8px 12px;border-radius:10px;background:var(--tk-soft);font-size:.93em;overflow-wrap:anywhere;word-break:keep-all}
.tk-note::before{content:"※ ";font-weight:700;color:var(--tk-acc)}
.tk-gap{height:6px}
.tk-box{margin:14px 0 4px;border:2px solid var(--tk-acc);border-radius:14px;overflow:hidden;background:var(--tk-soft)}
.tk-bt{padding:9px 14px;font-weight:800;color:var(--tk-acc);border-bottom:2px solid var(--tk-acc);overflow-wrap:anywhere;word-break:keep-all}
.tk-row{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:8px;padding:8px 14px;border-top:1px solid var(--tk-line)}
.tk-bt+.tk-row{border-top:0}
.tk-k{font-weight:700;color:var(--tk-acc);white-space:nowrap}
.tk-v{font-weight:600;overflow-wrap:anywhere;word-break:keep-all}
.tk-row1{padding:8px 14px;border-top:1px solid var(--tk-line);font-size:.93em;overflow-wrap:anywhere;word-break:keep-all}
.tk-r{color:var(--tk-red)}.tk-b{color:var(--tk-blue)}.tk-g{color:var(--tk-green)}.tk-o{color:var(--tk-orange)}
.tk-L{font-size:1.25em;font-weight:700}.tk-S{font-size:.85em}

/* 11/23 오늘 일정 강조 · 다음 등교일 박스는 흐리게 */
.tk-h{font-size:1.05em;margin:2px 0 10px}
.tk-item{align-items:center;gap:12px;padding:12px 14px;margin:0 0 8px;border:1px solid var(--tk-line);border-left:5px solid var(--tk-acc);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tk-item:first-of-type{border-top:1px solid var(--tk-line)}
.tk-ck{margin-top:0;width:28px;height:28px}
.tk-item.done .tk-ck::after{left:9px;top:4px}
.tk-tx{align-items:center;flex-wrap:nowrap;gap:10px;font-size:1.1em;font-weight:700;line-height:1.4}
.tk-n{font-size:.8em;color:var(--tk-mut);min-width:auto}
.tk-time{flex:none;font-variant-numeric:tabular-nums;font-weight:800;font-size:.85em;color:#fff;background:var(--tk-acc);border-radius:8px;padding:2px 9px;white-space:nowrap}
.tk-item.done{opacity:.55;box-shadow:none;border-left-width:1px;padding:8px 14px}
.tk-item.done .tk-tx{font-weight:500;font-size:1em}
.tk-item.done .tk-time{background:var(--tk-mut);text-decoration:line-through}
.tk-p{margin:12px 0 6px;padding:10px 14px;border-radius:12px;border:1px dashed var(--tk-line2);font-weight:600}
.tk-box{margin:24px 0 4px;border:1.5px dashed var(--tk-line2);background:transparent;opacity:.7;font-size:.9em}
.tk-bt{color:var(--tk-mut);font-weight:700;border-bottom:1px dashed var(--tk-line2);padding:7px 14px}
.tk-row{padding:5px 14px}.tk-row1{padding:5px 14px}
.tk-k{color:var(--tk-mut);font-weight:600}
.tk-v{font-weight:500}
/* 11/23 안내·※ 줄은 박스 하나로 */
.tk-foot{margin:14px 0 6px;padding:2px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(255,196,60,.18),rgba(255,150,40,.08));border:1px solid rgba(224,165,38,.45);border-left:5px solid #e0a526}
.tk-foot .tk-p{margin:0;padding:11px 0;border:0;border-radius:0;font-weight:700}
.tk-foot .tk-note{margin:0;padding:9px 0;background:none;border-radius:0;border-top:1px dashed rgba(224,165,38,.5);font-size:.95em}
.tk-foot .tk-note::before{color:#c98a0b}
.tk-foot .tk-gap{display:none}
.tk-foot>:first-child{border-top:0}
/* 11/23 오늘 공지 전체를 한 박스로 */
.tk-sec{margin:6px 0 8px;padding:14px 14px 14px;border-radius:18px;background:linear-gradient(180deg,var(--tk-soft),var(--card) 140%);border:1px solid var(--tk-line);border-top:6px solid var(--tk-acc);box-shadow:0 3px 12px rgba(0,0,0,.07)}
.tk-sec .tk-h{margin:0 0 12px}
.tk-sec .tk-item{background:var(--card)}
.tk-sec .tk-item:last-of-type{margin-bottom:0}
.tk-sec .tk-foot{margin:12px 0 0;background:var(--card);background-image:linear-gradient(135deg,rgba(255,196,60,.16),rgba(255,150,40,.06))}
.tk-sec .tk-foot:first-child{margin-top:0;margin-bottom:12px}
.tk-sec>.tk-gap:last-child{display:none}
/* 11/23 촘촘하게 · 단색 · 초록 계열로 통일 (모바일 한 화면) */
.tk-sec{padding:10px;border-radius:14px;background:var(--tk-soft);background-image:none;border:1px solid var(--tk-line);border-top:4px solid var(--tk-acc);box-shadow:none}
.tk-sec .tk-h{margin:0 0 8px;font-size:1em}
.tk-item{gap:8px;padding:7px 10px;margin:0 0 5px;border-left-width:4px;border-radius:10px;box-shadow:none}
.tk-item.done{padding:4px 10px}
.tk-ck{width:22px;height:22px}
.tk-item.done .tk-ck::after{left:6px;top:2px;width:5px;height:10px}
.tk-tx{font-size:1em;gap:7px;line-height:1.35}
.tk-item.done .tk-tx{font-size:.9em}
.tk-time{font-size:.8em;padding:1px 7px;border-radius:6px}
.tk-foot,.tk-sec .tk-foot{margin:8px 0 0;padding:0 12px;border-radius:10px;background:var(--card);background-image:none;border:1px solid var(--tk-line);border-left:4px solid var(--tk-acc)}
.tk-foot .tk-p{padding:7px 0;font-size:.92em;line-height:1.45}
.tk-foot .tk-note{padding:6px 0;font-size:.88em;line-height:1.45;border-top:1px dashed var(--tk-line)}
.tk-foot .tk-note::before{color:var(--tk-acc)}
.tk-sec .tk-foot:first-child{margin:0 0 8px}
.tk-box{margin:12px 0 4px}
.tk-row,.tk-row1{padding:4px 12px}
/* 11/23 B 타임라인 · 진한 테두리 */
.tk-sec{background:var(--card);background-image:none;border:2px solid var(--tk-acc);border-radius:14px;padding:12px 14px;box-shadow:none}
.tk-sec .tk-h{margin:0 0 10px}
.tk-item,.tk-item:first-of-type,.tk-item.done,.tk-sec .tk-item{position:relative;display:block;margin:0 0 0 11px;padding:2px 0 10px 20px;border:0;border-left:2.5px solid var(--tk-acc);border-radius:0;background:transparent;box-shadow:none;opacity:1}
.tk-item.done{border-left-color:var(--tk-line2)}
.tk-ck{position:absolute;left:-12.5px;top:1px;width:22px;height:22px;margin:0;background:var(--card);border:2.5px solid var(--tk-acc)}
.tk-item.done .tk-ck{background:var(--tk-acc)}
.tk-item.done .tk-ck::after{left:6px;top:2px;width:5px;height:10px}
.tk-tx,.tk-item.done .tk-tx{display:block;font-size:1em;font-weight:600;line-height:1.4}
.tk-n{display:none}
.tk-time,.tk-item.done .tk-time{display:block;width:fit-content;background:none;color:var(--tk-acc);padding:0;border-radius:0;font-size:.82em;font-weight:800;margin-bottom:1px}
.tk-bd{display:block}
.tk-item.done .tk-tx,.tk-item.done .tk-time{color:var(--tk-mut);font-weight:500}
.tk-item.done .tk-tx{font-size:.92em}
.tk-foot,.tk-sec .tk-foot{margin:4px 0 0;padding:0 12px;border-radius:10px;background:rgba(0,0,0,.035);background-image:none;border:1.5px solid var(--tk-line2)}
.tk-foot .tk-p{padding:7px 0;font-size:.92em;font-weight:600}
.tk-foot .tk-note{padding:5px 0;font-size:.88em;border-top:1px dashed var(--tk-line2)}
.tk-foot .tk-note::before{color:var(--tk-acc)}

/* 11/23 지금 시각 반짝이 점 (오늘 일정 타임라인) */
.tk-sec{position:relative}
.tk-nowdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#ffb800;box-shadow:0 0 0 2px var(--card,#fff),0 0 7px 2px rgba(255,184,0,.85);z-index:3;pointer-events:none;animation:tkGlow 1.4s ease-in-out infinite}

</style></head><body><div class="wrap">
<div class="top"><h1>3학년 2반 알림판</h1><button type="button" class="tb" id="tb" aria-label="오늘로 돌아가기">📅 오늘</button></div>

<div class="tabs" id="tabs" role="tablist"></div>
<div id="main"></div>
<p class="foot">일정이 바뀌면 밴드로 공지합니다 · 출결은 반 전체 인원 수만 보여줍니다 · 화면 v8 · ⚡</p>
</div>
<script>
// ── GitHub 판(형 전용): 데이터는 Apps Script ?api=1에서 받고, 받은 건 이 기기에 저장해 두었다가 다음에 열 때 바로 보여줌 ──
const API="https://script.google.com/macros/s/AKfycbxXq6ya4PThz-qcPxZuwd8A4b9o57HAAXFtF7fP-t4rghCuBIQt_mAikj65kRCMc6gP/exec";
const CKEY="iboard-cache-v1";
const seoulToday=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
let BOOT_AC=null,BOOT_TM=0;
function syncMsg(t){const s=document.getElementById("sync");if(!s)return;s.textContent=t||"";s.hidden=!t}
function START(){
  let C=null;try{C=JSON.parse(localStorage.getItem(CKEY)||"null")}catch(e){}
  const fresh=C&&C.today===seoulToday();
  if(fresh){BOOT(C);syncMsg("⏳ 최신 내용 확인 중…")}
  else document.getElementById("main").innerHTML='<div class="card empty">불러오는 중…</div>';
  fetch(API+"?api=1",{cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(!j||!j.ok)throw new Error((j&&j.err)||"데이터를 못 받았어요");
    const s=JSON.stringify(j.r);try{localStorage.setItem(CKEY,s)}catch(e){}
    if(!fresh||s!==JSON.stringify(C))BOOT(j.r);
    syncMsg("")
  }).catch(e=>{if(fresh)syncMsg("⚠️ 최신 내용을 못 받아왔어요 (저장된 화면)");
    else document.getElementById("main").innerHTML='<div class="card empty">불러오지 못했어요. <a href="">다시 시도</a></div>'})}
function BOOT(RAW){
if(BOOT_AC)BOOT_AC.abort();BOOT_AC=new AbortController();const SIG={signal:BOOT_AC.signal};clearInterval(BOOT_TM);
{
// ── 공지 렌더러 (D와 알림판이 똑같이 씀) ──
// 표시법: {box}제목 … {/box} = 안내 박스(안의 "등교: 08:20"처럼 쓰면 칸으로) · 줄 맨 앞 [x] = 끝난 일(취소선) · **굵게** · {r}빨강{/} {b}파랑{/} {g}초록{/} {o}주황{/} · {L}크게{/} {S}작게{/}
const TK_RE_DONE=/^\[x\]\s?/;
function tkEsc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function tkFmt(s){return tkEsc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\{(r|b|g|o|L|S)\}([\s\S]*?)\{\/\}/g,(m,k,x)=>'<span class="tk-'+k+'">'+x+'</span>')}
function tkPlain(src){return String(src||"").split("\n").map(l=>l.replace(TK_RE_DONE,"").replace(/^\s*\{box\}\s*/,"━━━━━━━━━━━━\n").replace(/^\s*\{\/box\}\s*$/,"━━━━━━━━━━━━")).join("\n").replace(/\*\*(.+?)\*\*/g,"$1").replace(/\{(?:r|b|g|o|L|S|\/)\}/g,"")}
function tkItemBody(b){const m=String(b).match(/^\s*(\d{1,2}:\d{2}(?:\s*[~\-–]\s*\d{1,2}:\d{2})?)\s+([\s\S]*)$/);return m?'<span class="tk-time">'+tkEsc(m[1].replace(/\s+/g,""))+'</span><span class="tk-bd">'+tkFmt(m[2])+'</span>':'<span class="tk-bd">'+tkFmt(b)+'</span>'}
const TK_IC={"등교":"🕗","장소":"📍","내용":"📝","하교":"🏠","준비물":"🎒","급식":"🍚"};
function tkBox(b){return '<div class="tk-box">'+(b.t?'<div class="tk-bt">'+tkFmt(b.t)+'</div>':'')+b.rows.filter(r=>r.trim()).map(r=>{const m=r.match(/^\s*([^:：]{1,8}?)\s*[:：]\s*(.*)$/);if(!m)return '<div class="tk-row1">'+tkFmt(r)+'</div>';const k=m[1].trim();return '<div class="tk-row"><span class="tk-k">'+(TK_IC[k]?TK_IC[k]+' ':'')+tkFmt(k)+'</span><span class="tk-v">'+tkFmt(m[2])+'</span></div>'}).join('')+'</div>'}
// ✨ 특별 일정: 등교·하교·점심·조회·종례 같은 매일 일정이 아니면 반짝 효과
function tkSpecial(b){const t=String(b).replace(/^\s*\d{1,2}:\d{2}(?:\s*[~\-–]\s*\d{1,2}:\d{2})?\s*/,"").replace(/\*\*|\{(?:r|b|g|o|L|S|\/)\}/g,"").trim();
  return !!t&&!/^(정상\s*)?(등교|하교|점심|중식|석식|조회|종례|청소|자습|자율\s*학습|교실\s*(대기|정리)|귀가)/.test(t)}
function tkRender(src,check){
  const lines=String(src||"").split("\n");let left=0,total=0,box=null;const out=[];
  lines.forEach((ln,i)=>{let s=ln,done=false;
    if(box){if(/^\{\/box\}$/.test(s.trim())){out.push(tkBox(box));box=null}else box.rows.push(s);return}
    if(/^\{box\}/.test(s.trim())){box={t:s.trim().replace(/^\{box\}\s*/,""),rows:[]};return}
    if(TK_RE_DONE.test(s)){done=true;s=s.replace(TK_RE_DONE,"")}
    if(!s.trim()){out.push('<div class="tk-gap"></div>');return}
    if(done||/^\d+\.\s/.test(s)){total++;if(!done)left++;
      const m=s.match(/^(\d+)\.\s*(.*)$/),num=m?m[1]:"",body=m?m[2]:s;
      const ck=check?'<button type="button" class="tk-ck" data-i="'+i+'" aria-pressed="'+done+'" aria-label="'+(done?"완료 취소":"완료 표시")+'"></button>':'<span class="tk-ck" aria-hidden="true"></span>';
      const sp=!done&&tkSpecial(body);
      out.push('<div class="tk-item'+(done?" done":"")+(sp?" sp":"")+'">'+ck+'<span class="tk-tx">'+(num?'<span class="tk-n">'+num+'</span>':"")+tkItemBody(body)+'</span></div>');return}
    if(/^📢/.test(s)){out.push('<div class="tk-title">'+tkFmt(s.replace(/^📢\s*/,""))+'</div>');return}
    if(/^\[[^\]]*\]$/.test(s.trim())){out.push('<div class="tk-h">'+tkFmt(s.trim().slice(1,-1))+(total||1?'<span class="tk-left" data-left></span>':"")+'</div>');return}
    if(/^※/.test(s)){out.push('<div class="tk-note">'+tkFmt(s.replace(/^※\s*/,""))+'</div>');return}
    out.push('<p class="tk-p">'+tkFmt(s)+'</p>')});
  if(box)out.push(tkBox(box));
  const G=[];let grp=null;out.forEach(h=>{if(/^<(p class="tk-p"|div class="tk-note")/.test(h)){if(!grp){grp=[];G.push(grp)}grp.push(h)}else if(grp&&h==='<div class="tk-gap"></div>')grp.push(h);else{grp=null;G.push(h)}}); // 안내·※ 줄은 박스 하나로
  const H=G.map(x=>Array.isArray(x)?'<div class="tk-foot">'+x.join("")+'</div>':x);let a=0;while(a<H.length&&/^<div class="tk-(title|gap)"/.test(H[a]))a++;let b=a;while(b<H.length&&!/^<div class="tk-box"/.test(H[b]))b++; // 제목 밑 ~ 다음 등교일 박스 전까지 한 박스로
  return {html:H.slice(0,a).join("")+(b>a?'<div class="tk-sec">'+H.slice(a,b).join("")+'</div>':"")+H.slice(b).join(""),left,total};
}
function tkToggle(src,i){const L=String(src||"").split("\n");if(L[i]===undefined)return src;L[i]=TK_RE_DONE.test(L[i])?L[i].replace(TK_RE_DONE,""):"[x] "+L[i];return L.join("\n")}

const DATA=RAW.days||{}, today=RAW.today, DOCS=RAW.docs;
// 출결 기록이 하나도 없는 앞날(D가 출결 줄을 비워 보냄)도 "전원 등교 예정"으로 출결 칸을 보여줌 (11/25) — 반 명단·자리표는 다른 날 출결에서 가져옴
const ROSTER=(()=>{for(const d of Object.keys(DATA).sort()){const a=DATA[d].att,L=a&&a.list;if(!L||!a.tot)continue;const m=new Map();
  for(const k of ["here","trip","rec","abs","late","wait","early","pend","etc"])(L[k]||[]).forEach(o=>{o=typeof o==="string"?{n:o}:o;if(o&&o.no&&!m.has(o.no))m.set(o.no,{no:o.no,n:o.n,m:""})});
  if(m.size)return {tot:a.tot,here:[...m.values()].sort((p,q)=>p.no<q.no?-1:1),seat:L.seat};}return null})();
const noRec=d=>({tot:ROSTER.tot,now:ROSTER.tot,trip:0,abs:0,late:0,early:0,pend:0,at:"",none:1,list:{here:ROSTER.here,seat:ROSTER.seat}});
const days=Object.keys(DATA).sort();
const W="일월화수목금토";
let i=0,openK="";
const nowHM=()=>new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
function tkNowDot(root,selSec){ // 오늘 일정: 지금 시각 위치에 반짝이는 점 (시각 사이는 비율대로 이동)
  const sec=root&&root.querySelector(selSec||".notice-card .tk-sec");if(!sec)return;
  sec.querySelectorAll(".tk-nowdot").forEach(e=>e.remove());
  if(!sec._ro&&window.ResizeObserver){sec._ro=new ResizeObserver(()=>tkNowDot(root,selSec));sec._ro.observe(sec)} // 접혀 있다가 펼쳐질 때 다시 계산
  if(!sec.offsetWidth||!sec.offsetHeight)return; // 안 보일 땐 점 안 찍음
  const its=[...sec.querySelectorAll(".tk-item")];if(!its.length)return;
  const p=nowHM().split(":"),now=(+p[0])*60+(+p[1]);
  const T=its.map(e=>{const t=e.querySelector(".tk-time")||e.querySelector(".tk-bd"),m=t&&t.textContent.match(/^\s*(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null});
  const P=T.map((t,k)=>t===null?-1:k).filter(k=>k>=0);if(!P.length)return;
  const R=sec.getBoundingClientRect(),bx=R.left+sec.clientLeft,by=R.top+sec.clientTop,pos=k=>{const c=its[k].querySelector(".tk-ck")||its[k],r=c.getBoundingClientRect();return {x:r.left+r.width/2-bx,y:r.top+r.height/2-by}};
  let a=-1;for(const k of P)if(T[k]<=now)a=k;
  let x,y;
  if(a<0)({x,y}=pos(P[0])); // 첫 일정 전: 첫 점에서 대기
  else{const b=P.find(k=>k>a);if(b===undefined||T[b]<=T[a])({x,y}=pos(a));
    else{const A=pos(a),B=pos(b),f=Math.min(1,(now-T[a])/(T[b]-T[a]));x=A.x+(B.x-A.x)*f;y=A.y+(B.y-A.y)*f}}
  const d=document.createElement("span");d.className="tk-nowdot";d.title="지금 "+nowHM();d.style.left=x+"px";d.style.top=y+"px";sec.appendChild(d);
}
addEventListener("resize",()=>{if(days[i]===today)tkNowDot(document.getElementById("main"))},SIG);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lab=d=>{const t=new Date(d+"T12:00:00");return (t.getMonth()+1)+"/"+t.getDate()+" ("+W[t.getDay()]+")"};
let TW=0; // 날짜 탭 창 시작 위치 (3개씩, J와 같은 방식)
function tabs(){const T=document.getElementById("tabs");
  const B=days.map((d,k)=>'<button type="button" role="tab"'+(DATA[d]&&DATA[d].pink?' class="pink" title="'+esc(DATA[d].pink)+'"':'')+' aria-selected="'+(k===i)+'" data-i="'+k+'">'+lab(d)+'<small>'+(d===today?"오늘":k===0||(k===1&&days[0]===today)?"다음 등교일":(k===i?"":"&nbsp;"))+(k===i?'<i class="dd" aria-hidden="true">▾</i>':'')+'</small></button>'); // 고른 탭 날짜 옆 작은 ▾ = 누르면 달력 (D처럼, 11/25) · 날짜가 크게, 오늘·다음 등교일은 아래 작게 · 고른 탭엔 📅(누르면 달력)
  const W3=[i-1,i,i+1].map(k=>B[k]||'<span class="ph"></span>').join(""); // 고른 날을 늘 가운데 (첫날·끝날이면 빈 칸)
  T.innerHTML='<button type="button" class="nv" data-nv="-1" aria-label="이전 날짜"'+(i<=0?' disabled':'')+'>‹</button><div class="tw">'+W3+'</div><button type="button" class="nv" data-nv="1" aria-label="다음 날짜"'+(i>=days.length-1?' disabled':'')+'>›</button>';
  T.querySelectorAll("button.nv").forEach(b=>b.onclick=()=>{calClose();i=Math.min(Math.max(0,i+ +b.dataset.nv),days.length-1);openK="";tabs();show()});
  T.querySelectorAll(".tw button").forEach(b=>b.onclick=()=>{if(+b.dataset.i===i)return document.getElementById("calov")?calClose():calOpen();calClose();i=+b.dataset.i;openK="";tabs();show()})} // 이미 고른 탭을 또 누르면 달력
// ── 📅 달력 (J와 같은 방식): 날짜 탭이 있는 날(등교일)만 누를 수 있음 ──
let CALM="";
function calArrow(on){const e=document.querySelector("#tabs [aria-selected=true] .dd");if(e)e.textContent=on?"▴":"▾"} // 열려 있으면 ▴(누르면 닫힘), 닫혀 있으면 ▾
function calOpen(){CALM=days[i].slice(0,7);calDraw();calArrow(true)}
function calClose(){const o=document.getElementById("calov");if(o)o.remove();calArrow(false);document.removeEventListener("keydown",calKey)}
function calKey(e){if(e.key==="Escape")calClose()}
function calDraw(){let o=document.getElementById("calov");
  if(!o){o=document.createElement("div");o.id="calov";o.className="calov";o.onclick=e=>{if(e.target===o)calClose()};document.body.appendChild(o);document.addEventListener("keydown",calKey)}
  {const tb=document.getElementById("tabs").getBoundingClientRect();o.style.top=Math.max(0,Math.round(tb.bottom))+"px";o.style.paddingTop="6px"} // 날짜 탭(오늘 칸) 안 가리게 탭 바로 밑에서 뜸 (11/25)
  const y=+CALM.slice(0,4),m=+CALM.slice(5,7),first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate(),p=v=>String(v).padStart(2,"0");
  const lo=days[0].slice(0,7),hi=days[days.length-1].slice(0,7),idx=new Map(days.map((d,k)=>[d,k]));
  let g='';for(const w of W)g+='<div class="wd'+(w==="일"?' su':'')+'">'+w+'</div>';
  for(let k=0;k<first;k++)g+='<div></div>';
  for(let dd=1;dd<=n;dd++){const d=y+"-"+p(m)+"-"+p(dd),k=idx.get(d),on=k!==undefined,has=on&&!!(DATA[d].notice||DATA[d].jo);
    const c=[on&&DATA[d].pink?'pink':'',d===today?'td':'',on&&k===i?'sel':''].filter(Boolean).join(' ');
    g+='<button type="button"'+(c?' class="'+c+'"':'')+(on?' data-k="'+k+'"':' disabled')+' aria-label="'+lab(d)+'">'+dd+(has?'<i></i>':'')+'</button>'}
  o.innerHTML='<div class="calbx" role="dialog" aria-label="날짜 고르기"><div class="calhd"><button type="button" data-mv="-1" aria-label="이전 달"'+(CALM<=lo?' disabled':'')+'>‹</button><b>'+y+'년 '+m+'월</b><button type="button" data-mv="1" aria-label="다음 달"'+(CALM>=hi?' disabled':'')+'>›</button><button type="button" class="calx" aria-label="닫기">✕</button></div>'
    +'<div class="calgr">'+g+'</div><div class="calft">초록 테두리 = 오늘 · 분홍 = 결석 많은 날 · 점 = 공지 있음<br>흐린 날짜는 등교일이 아니거나 아직 안 올라온 날이에요.</div></div>';
  o.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const t=new Date(y,m-1+ +b.dataset.mv,1);CALM=t.getFullYear()+"-"+p(t.getMonth()+1);calDraw()});
  o.querySelector(".calx").onclick=calClose;
  o.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{i=+b.dataset.k;openK="";calClose();tabs();show();window.scrollTo({top:0,behavior:"smooth"})})}
function show(){
  const m=document.getElementById("main");
  if(!days.length){m.innerHTML='<div class="card empty">아직 올라온 공지가 없어요.</div>';return}
  const d=days[i],x=DATA[d],dt=new Date(d+"T12:00:00");
  let h="";

  m.innerHTML=h;

  if(A){const N={here:A.fut?"등교 예정 자리표":"지금 교실 자리표",trip:"교외체험",rec:"인정결석",abs:"결석",late:"지각",early:"조퇴",plan:"조퇴 예정",wait:"지각 예정",pend:"확인 중",etc:"위탁"};

// 🧭 바로가기 (I는 접기 없음 · 자리표 바로가기 포함)
(()=>{const OPEN=new Set(),SEEN=new WeakSet();
  const key=c=>{const h=c.querySelector("h2")||c.querySelector("summary");let t=h?(h.childNodes[0]&&h.childNodes[0].nodeType===3?h.childNodes[0].textContent:h.textContent):"";
    return t.replace(/\((예정|\d+일)\)/g,"").replace(/오늘\s+|\d{1,2}\/\d{1,2}\s*\([^)]*\)\s*/g,"").replace(/\s+/g," ").trim()};
  const cards=()=>[...document.querySelectorAll(".card")].filter(c=>!c.closest(".qjmenu")&&!c.classList.contains("ad")&&!c.classList.contains("empty")&&(c.tagName==="DETAILS"?c.querySelector(":scope>summary"):c.querySelector("h2")));
  function apply(){return; /* I는 접기 없이 다 펼침 */cards().forEach(c=>{const k=key(c);if(!k)return;
    if(c.tagName==="DETAILS"){if(!SEEN.has(c)){SEEN.add(c);c.open=OPEN.has(k);c.addEventListener("toggle",()=>{if(c.open)OPEN.add(k);else OPEN.delete(k)})}return}

    if(!SEEN.has(c)){SEEN.add(c);c.classList.add("qf");h.classList.add("fh");
      h.addEventListener("click",e=>{if(e.target.closest("button,a,input,label,select,textarea"))return;if(OPEN.has(k))OPEN.delete(k);else OPEN.add(k);c.classList.toggle("fold",!OPEN.has(k))})}
    c.classList.toggle("fold",!OPEN.has(k))})}
  let tm=0;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(apply,0)}).observe(document.body,{childList:true,subtree:true});apply();
  const btn=document.createElement("button"),menu=document.createElement("div");
  btn.type="button";btn.className="qjbtn";btn.id="qjBtn";btn.textContent="🧭 바로가기";btn.setAttribute("aria-expanded","false");
  menu.className="qjmenu";menu.hidden=true;menu.setAttribute("role","menu");document.body.append(menu,btn);

    cards().filter(c=>c.getClientRects().length).forEach(c=>{const k=key(c);if(!k)return;const b=document.createElement("button");b.type="button";b.setAttribute("role","menuitem");b.textContent=k;
